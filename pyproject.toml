[project]
name = "batcontrol"
dynamic = ["version"]
description = "Optimize electricity costs by recharging your PV battery when electricity is cheap and solar power is insufficient"
authors = [{name = "Stephan Mükusch", email = "muexxl@gmx.net"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11, <3.15"
dependencies = [
    # Python 3.14 needs higher floors: the older releases have no cp314 wheels,
    # so a resolver would otherwise try to build them from source.
    "numpy>=1.24; python_version < '3.14'",
    "numpy>=2.3.2; python_version >= '3.14'",
    "pandas>=2.0; python_version < '3.14'",
    "pandas>=2.3.3; python_version >= '3.14'",
    "PyYAML>=6.0; python_version < '3.14'",
    "PyYAML>=6.0.3; python_version >= '3.14'",
    "requests>=2.28",
    "paho-mqtt>=2.0",
    "packaging>=23.0",
    "cachetools>=5.0",
    # websockets.asyncio.client is used by the HomeAssistant providers and was
    # added in websockets 13.0.
    "websockets>=13.0",
    "schedule>=1.2.0",
    "pytz>=2024.2",
    # Read-only web API, dashboard and MCP server (src/batcontrol/web).
    # Regular dependencies on purpose: the Home Assistant stable add-on
    # installs the plain release wheel, so an optional extra would silently
    # ship an add-on without a dashboard.
    "fastapi>=0.115",
    # Plain uvicorn, not [standard]: uvloop/httptools/watchfiles are compiled
    # extras that only matter for raw throughput and --reload, neither of
    # which this uses. On a platform without a prebuilt wheel they would turn
    # a pip install into a source build - the Dockerfile prefers piwheels
    # precisely because armv7 users exist.
    "uvicorn>=0.30",
    # Upper bound on purpose: 2.x renamed FastMCP to MCPServer, and this code
    # imports mcp.server.mcpserver directly. A 3.x may rename again, and the
    # feature is off by default, so a silent break would surface late.
    "mcp>=2.3,<3"
]

# Config for the build system
[build-system]
requires = ["setuptools>=66.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["./src"]

# The dashboard is built by npm into src/batcontrol/web/static and has to
# travel inside the wheel: the Home Assistant stable add-on installs nothing
# but that wheel. See docs/development/frontend-build.md.
[tool.setuptools.package-data]
# Includes the bundled fonts and their OFL license texts, which the build
# emits into static/assets - see THIRD-PARTY-LICENSES.md.
"batcontrol.web" = ["static/**/*"]

[tool.setuptools.dynamic]
version = {attr = "batcontrol.__pkginfo__.__version__"}

# Configure additional tools
[tool.uv]
required-version = ">=0.7.0" # Keep a minimum version while allowing newer uv releases

# Testing configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]
addopts = "--strict-markers -v"
asyncio_mode = "auto"

# For testing
[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.0.0",
    # fastapi.testclient needs httpx
    "httpx>=0.27",
]
docs = [
    "mkdocs-material>=9.5,<10",
    "mkdocs-llmstxt>=0.5.0,<1.0",
    # Embeds the generated OpenAPI schema as Swagger UI in the API reference
    "mkdocs-swagger-ui-tag>=0.8,<1.0",
]

# Bump Version
[tool.bumpversion]
current_version = "0.10.1"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?P<release>dev)?"
serialize = [
    "{major}.{minor}.{patch}{release}",
    "{major}.{minor}.{patch}"
]
ignore_current_version = true
tag_name = "{new_version}"
message = "Bump version: {current_version} → {new_version}"

[tool.bumpversion.parts.release]
optional_value = ""
values = [
    "dev",
    ""
]

[[tool.bumpversion.files]]
filename = "src/batcontrol/__pkginfo__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""
