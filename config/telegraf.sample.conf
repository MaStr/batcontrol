[global_tags]
   source = "Telegraf"

[agent]
   omit_hostname = true

[[outputs.influxdb]]
   urls = ["http://influxdb:8086"]
   database = "db0"
   username = "admin"
   password = "admin"
   retention_policy = "autogen"

[[inputs.mqtt_consumer]]
   servers = ["tcp://mqtt:1883"]
   topics  = [
	"house/batcontrol/+"
	]
   data_format = "value"
   data_type   = "auto_float"
   [[inputs.mqtt_consumer.topic_parsing]]
      topic = "+/batcontrol/+"
      measurement = "_/measurement/_"
      tags = "_/_/pivot_field"
   # The "value" parser keeps only the last whitespace separated token of a
   # payload, so free text like /decision would arrive truncated. It is
   # handled by the dedicated consumer below instead.
   [inputs.mqtt_consumer.tagdrop]
      pivot_field = ["decision"]

# /decision is a full sentence ("Charge from Grid 1250 W - ..."), so it needs
# a parser that takes the payload as a whole instead of the "value" parser.
[[inputs.mqtt_consumer]]
   servers = ["tcp://mqtt:1883"]
   topics  = [
	"house/batcontrol/decision"
	]
   name_override = "batcontrol-decision"
   data_format   = "grok"
   grok_patterns = ["%{GREEDYDATA:decision}"]

# Optional: the machine readable side of the same status change. Both fields
# are null until the first decision with a decisive step, hence optional.
