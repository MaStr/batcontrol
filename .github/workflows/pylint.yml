name: Pylint

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release-*
      - prepare-release-*
  pull_request:
    branches:
      - main
      - release-*
      - prepare-release-*

jobs:
  lint:
    #runs-on: self-hosted
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11" , "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up uv with Python ${{ matrix.python-version }}
        id: setup-uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install .
          uv pip install pylint

      - name: Run pylint
        run: |
          # Parallel pylint pickles its state with dill, and dill 0.4.1 reads
          # code.co_lnotab, which Python 3.15 removed. Run single-process on
          # 3.15 until dill supports it.
          pylint -j ${{ matrix.python-version == '3.15' && '1' || '0' }} --fail-under 9 --source-roots ./src batcontrol
