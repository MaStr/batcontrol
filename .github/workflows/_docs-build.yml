name: Build Documentation

on:
  workflow_call:
    outputs:
      artifact-id:
        description: "ID of the uploaded docs artifact"
        value: ${{ jobs.build.outputs.artifact-id }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install batcontrol and documentation dependencies
        run: pip install -e ".[docs]"

      - name: Generate peak shaving scenario data
        run: python scripts/generate_peak_shaving_csv.py

      # The published API reference is rendered from the schema the code
      # produces, so it cannot drift from the implementation.
      - name: Generate the OpenAPI schema
        run: python scripts/dump_openapi.py

      - name: Build documentation
        run: mkdocs build --strict

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site
          retention-days: 1
